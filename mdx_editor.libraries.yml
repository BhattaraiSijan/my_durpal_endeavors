mdx-editor:
  version: 1.0.0
  js:
    js/dist/mdx-editor-build.js: { minified: true }
    js/src/syntax-initializer.js: {minified: true}
  css:
    component:
      node_modules/@mdxeditor/editor/dist/style.css: {}
      js/css/mdx-editor-build.css: {}
  dependencies:
    - core/drupal
    - core/jquery
    - core/once

mdx-renderer:
  version: 1.0.0
  js:
    js/dist/mdx-renderer-build.js: { minified: true }
    js/src/syntax-initializer.js: {minified: true}
  css:
    component:
      node_modules/@mdxeditor/editor/dist/style.css: {}
      js/css/mdx-renderer-build.css: {}
      # css/mdx-isolated-syntax.css: { weight: 100 }
  dependencies:
    - core/drupal
    - core/jquery
    - core/once
    - mdx_editor/prism

mdx-remote:
  version: 1.0.0
  js:
    js/dist/mdx-remote-build.js: { minified: true }
    js/src/syntax-initializer.js: {minified: true}
  css:
    component:
      js/css/mdx-renderer-build.css: {}
      # js/css/mdx-components.css: {}
      # css/mdx-isolated-syntax.css: { weight: 100 }
  dependencies:
    - core/drupal
    - core/jquery
    - core/once
    - mdx_editor/prism

prism:
  version: 1.29.0
  js:
    https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js: { type: external, minified: true }
    https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js: { type: external, minified: true }
  dependencies:
    - core/drupal